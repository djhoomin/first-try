[project]
name = "first-try"
version = "0.1.0"
description = "A usability benchmark for agent-facing APIs: does an agent get it right on the first try?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "mcp>=1.2"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
first-try = "first_try.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/first_try"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
